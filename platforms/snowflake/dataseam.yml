site:
  title: Acme Books (Snowflake Demo)
  output: ./site
  agent_context: true

sql_dialect: snowflake

warehouse:
  platform: snowflake
  lowercase_ids: false
  job_history:
    enabled: true
    days: 30
    export_path: ./history.jsonl

column_lineage:
  enabled: true
  cache_dir: ./.dataseam-cache

dbt_projects:
  - name: acme_sf
    path: ./dbt
    artifacts:
      source: path
      uri: ./dbt/target

airflow:
  - name: sf_pipelines
    path: ./pipelines
    dag_globs: ["dags/**/*.py"]
    default_database: ACME_PROD
    extractors:
      - type: snowflake_operators
      - type: sql_operators
