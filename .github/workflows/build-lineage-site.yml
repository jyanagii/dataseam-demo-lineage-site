# Generated by dataseam scaffold ci.
# Copy this file to the aggregate repository. Match artifacts.source to github_actions.
# Stage Tableau and Metabase inputs at the paths named in dataseam.yml.
# Check Pages access settings before publishing lineage data.
# Enable GitHub Actions as the Pages source.
# Set ARTIFACTS_READ_TOKEN with Actions read access to dbt repos.

name: Build lineage site
'on':
  schedule:
  - cron: 0 21 * * *
  repository_dispatch:
    types:
    - artifacts-updated
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: dataseam-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - uses: actions/cache@v6.1.0
      with:
        key: dataseam-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: dataseam-${{ runner.os }}-
        path: .dataseam-cache
    - name: Build and check the site
      run: |
        checkout_repo() {
          repo=$1
          ref=$2
          checkout=$3
          provider=$4
          if [ -e "$checkout" ]; then
            return
          fi
          auth=
          case "$provider" in
            github)
              if [ -n "${READ_REPOS_TOKEN:-}" ]; then
                auth="x-access-token:$READ_REPOS_TOKEN"
              fi
              ;;
            gitlab)
              if [ -n "${GITLAB_REPOS_READ_TOKEN:-}" ]; then
                auth="oauth2:$GITLAB_REPOS_READ_TOKEN"
              else
                case "$repo" in
                  "${CI_SERVER_URL:-}/"*)
                    if [ -n "${CI_JOB_TOKEN:-}" ]; then
                      auth="gitlab-ci-token:$CI_JOB_TOKEN"
                    fi
                    ;;
                esac
              fi
              ;;
          esac
          if [ -n "$auth" ]; then
            header=$(printf '%s' "$auth" | base64 | tr -d '\n')
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$repo.extraHeader" \
              GIT_CONFIG_VALUE_0="Authorization: Basic $header" \
              git clone --depth 1 --branch "$ref" -- "$repo" "$checkout"
          else
            git clone --depth 1 --branch "$ref" -- "$repo" "$checkout"
          fi
        }
        checkout_repo https://github.com/jyanagii/dataseam-demo-bi-airflow main repos/bi-airflow github
        python -m pip install 'dataseam @ git+https://github.com/jyanagii/dataseam.git@8b58901d408be32d5d55fc55914a119e163c2afe'
        dataseam build --strict -c dataseam.yml --output public
      env:
        READ_REPOS_TOKEN: ${{ secrets.READ_REPOS_TOKEN }}
        GITLAB_REPOS_READ_TOKEN: ${{ secrets.GITLAB_REPOS_READ_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.ARTIFACTS_READ_TOKEN || github.token }}
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: lineage-site-static
        path: public
    - uses: actions/upload-pages-artifact@v5.0.0
      if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
      with:
        path: public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5.0.1
