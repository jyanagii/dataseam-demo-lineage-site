# Generated by dataseam scaffold ci --impact.
# Copy this file to the aggregate (lineage-site) repository.
# Set PR_WRITEBACK_TOKEN (comments and commit statuses only), READ_REPOS_TOKEN.
# Optional: DATASEAM_BOT_LOGIN, needed when the write token cannot read its own user.
# Under fail_on: none, failures are non-blocking for gradual rollout.

name: PR impact check
'on':
  workflow_dispatch:
    inputs:
      source_repo:
        required: true
        type: string
      source_project:
        required: false
        type: string
        default: ''
      source_kind:
        required: true
        type: string
        default: dbt
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      run_id:
        required: false
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: dataseam-impact-${{ inputs.source_repo }}-${{ inputs.pr_number }}
  cancel-in-progress: true
env:
  DATASEAM_INSTALL_TOKEN: ${{ secrets.READ_REPOS_TOKEN }}
jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - name: Install DataSeam
      run: |
        if [ -n "${DATASEAM_INSTALL_TOKEN:-}" ]; then
          git config --global url."https://x-access-token:${DATASEAM_INSTALL_TOKEN}@github.com/jyanagii/dataseam".insteadOf "https://github.com/jyanagii/dataseam"
        fi
        python -m pip install 'dataseam @ git+https://github.com/jyanagii/dataseam.git@aa1325dc97596d5283b370df86534e5fd0b2ed7d'
    - name: Check out the trusted source repositories
      env:
        READ_REPOS_TOKEN: ${{ secrets.READ_REPOS_TOKEN }}
        GITLAB_REPOS_READ_TOKEN: ${{ secrets.GITLAB_REPOS_READ_TOKEN }}
      run: |
        checkout_repo() {
          repo=$1
          ref=$2
          checkout=$3
          provider=$4
          if [ -e "$checkout" ]; then
            return
          fi
          auth=
          case "$provider" in
            github)
              if [ -n "${READ_REPOS_TOKEN:-}" ]; then
                auth="x-access-token:$READ_REPOS_TOKEN"
              fi
              ;;
            gitlab)
              if [ -n "${GITLAB_REPOS_READ_TOKEN:-}" ]; then
                auth="oauth2:$GITLAB_REPOS_READ_TOKEN"
              else
                case "$repo" in
                  "${CI_SERVER_URL:-}/"*)
                    if [ -n "${CI_JOB_TOKEN:-}" ]; then
                      auth="gitlab-ci-token:$CI_JOB_TOKEN"
                    fi
                    ;;
                esac
              fi
              ;;
          esac
          if [ -n "$auth" ]; then
            header=$(printf '%s' "$auth" | base64 | tr -d '\n')
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$repo.extraHeader" \
              GIT_CONFIG_VALUE_0="Authorization: Basic $header" \
              git clone --depth 1 --branch "$ref" -- "$repo" "$checkout"
          else
            git clone --depth 1 --branch "$ref" -- "$repo" "$checkout"
          fi
        }
        checkout_repo https://github.com/jyanagii/dataseam-demo-bi-airflow main repos/bi-airflow github
    - name: Run impact check
      id: impact
      env:
        SOURCE_REPO: ${{ inputs.source_repo }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id
          }}
        SOURCE_PROJECT: ${{ inputs.source_project }}
        SOURCE_KIND: ${{ inputs.source_kind }}
        RUN_ID: ${{ inputs.run_id }}
        LINEAGE_BUCKET: ${{ vars.LINEAGE_BUCKET }}
        GITHUB_TOKEN: ${{ secrets.READ_REPOS_TOKEN || github.token }}
      run: |
        dataseam impact-pr -c dataseam.yml --store github_actions --repo "$SOURCE_REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --kind "$SOURCE_KIND" --project "$SOURCE_PROJECT" --run-id "$RUN_ID" --comment-file impact-comment.md --summary-file "$GITHUB_STEP_SUMMARY" --result-file "$GITHUB_OUTPUT" --summary-url "$SUMMARY_URL"
    - name: Post PR comment and status
      if: steps.impact.outputs.exit_code != '' && steps.impact.outputs.skipped != 'true'
      continue-on-error: false
      env:
        SOURCE_REPO: ${{ inputs.source_repo }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_SHA: ${{ inputs.head_sha }}
        SUMMARY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id
          }}
        GITHUB_TOKEN: ${{ secrets.PR_WRITEBACK_TOKEN }}
        DATASEAM_BOT_LOGIN: ${{ vars.DATASEAM_BOT_LOGIN }}
        IMPACT_STATUS: ${{ steps.impact.outputs.status }}
        IMPACT_EXIT: ${{ steps.impact.outputs.exit_code }}
      run: |
        update_only=""
        if [ "$IMPACT_STATUS" = no_change ]; then update_only=--update-only; fi
        dataseam impact-post --provider github --repo "$SOURCE_REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --body-file impact-comment.md --exit-code "$IMPACT_EXIT" --fail-on breaking --target-url "$SUMMARY_URL" --api-url "$GITHUB_API_URL" --bot-login "$DATASEAM_BOT_LOGIN" $update_only
    - name: Apply fail_on
      if: steps.impact.outputs.exit_code != '' && steps.impact.outputs.skipped != 'true'
      env:
        IMPACT_EXIT: ${{ steps.impact.outputs.exit_code }}
      run: |
        if [ breaking != none ] && [ "$IMPACT_EXIT" -ne 0 ]; then exit "$IMPACT_EXIT"; fi
